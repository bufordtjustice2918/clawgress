name: Security Review (Free)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - current
      - mvpv2.1
      - mvpv2.2

permissions:
  contents: read
  security-events: write

jobs:
  actionlint:
    name: Workflow Lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest

      - name: Detect changed workflow files
        id: changed
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before || '' }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            DIFF_TARGET="origin/${{ github.base_ref }}...HEAD"
          elif [[ -n "${BEFORE}" && "${BEFORE}" != "0000000000000000000000000000000000000000" ]]; then
            DIFF_TARGET="${BEFORE}...HEAD"
          else
            DIFF_TARGET="HEAD~1...HEAD"
          fi
          mapfile -t files < <(git diff --name-only ${DIFF_TARGET} | grep -E '^\.github/workflows/.*\.ya?ml$' || true)
          {
            echo 'files<<EOF'
            printf '%s\n' "${files[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run actionlint on changed workflows
        run: |
          set -euo pipefail
          FILES='${{ steps.changed.outputs.files }}'
          if [[ -z "${FILES//[[:space:]]/}" ]]; then
            echo "No changed workflow files; skipping actionlint"
            exit 0
          fi
          mapfile -t wf_files <<< "${FILES}"
          args=()
          for f in "${wf_files[@]}"; do
            [[ -n "$f" ]] && args+=("$f")
          done
          "${HOME}/go/bin/actionlint" -shellcheck= -color "${args[@]}"

  shell-lint:
    name: Shell Lint (shellcheck + shfmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: Detect changed shell files
        id: changed
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before || '' }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            DIFF_TARGET="origin/${{ github.base_ref }}...HEAD"
          elif [[ -n "${BEFORE}" && "${BEFORE}" != "0000000000000000000000000000000000000000" ]]; then
            DIFF_TARGET="${BEFORE}...HEAD"
          else
            DIFF_TARGET="HEAD~1...HEAD"
          fi
          mapfile -t files < <(git diff --name-only ${DIFF_TARGET} | grep -E '\.sh$' || true)
          {
            echo 'files<<EOF'
            printf '%s\n' "${files[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run shellcheck and shfmt on changed files
        run: |
          set -euo pipefail
          FILES='${{ steps.changed.outputs.files }}'
          if [[ -z "${FILES//[[:space:]]/}" ]]; then
            echo "No changed shell files found; skipping shell lint"
            exit 0
          fi
          mapfile -t sh_files <<< "${FILES}"
          args=()
          for f in "${sh_files[@]}"; do
            [[ -n "$f" ]] && args+=("$f")
          done
          shellcheck "${args[@]}"
          shfmt -d "${args[@]}"

  semgrep:
    name: Static Analysis (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Detect changed source files
        id: changed
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before || '' }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            DIFF_TARGET="origin/${{ github.base_ref }}...HEAD"
          elif [[ -n "${BEFORE}" && "${BEFORE}" != "0000000000000000000000000000000000000000" ]]; then
            DIFF_TARGET="${BEFORE}...HEAD"
          else
            DIFF_TARGET="HEAD~1...HEAD"
          fi
          mapfile -t files < <(git diff --name-only ${DIFF_TARGET} | grep -E '^(src|scripts)/.*\.(py|sh)$' || true)
          {
            echo 'files<<EOF'
            printf '%s\n' "${files[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Semgrep on changed files
        run: |
          set -euo pipefail
          FILES='${{ steps.changed.outputs.files }}'
          if [[ -z "${FILES//[[:space:]]/}" ]]; then
            echo "No changed source files; skipping semgrep"
            exit 0
          fi
          mapfile -t scan_files <<< "${FILES}"
          args=()
          for f in "${scan_files[@]}"; do
            [[ -n "$f" ]] && args+=("$f")
          done
          semgrep scan --config p/default --error "${args[@]}"

  gitleaks:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Vulnerability Scan (Trivy FS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan (advisory)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '0'
